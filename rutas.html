<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rutas</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <header>
        <nav>
            <h2>Rutas Seguras Kids</h2>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="rutas.html">Rutas</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="crear-ruta">
            <h1>Crear Ruta</h1>
            <form id="route-form">
                <label for="route-name">Nombre de la ruta</label>
                <input type="text" id="route-name" placeholder="Ej: Ruta Norte" required>
                
                <label for="driver-name">Conductor</label>
                <input type="text" id="driver-name" placeholder="Ej: Juan Pérez" required>
                
                <label for="departure-time">Hora de salida</label>
                <input type="time" id="departure-time" required>
                
                <label for="city">Ciudad</label>
                <input type="text" id="city" placeholder="Ej: Bogotá" required>
                
                <button type="submit">Crear Ruta</button>
            </form>
        </section>
        <section id="routes-section">
            <h2>Rutas Registradas</h2>
            <div id="routes-container"></div>
        </section>
    </main>
    <footer>
        <p>© 2026 Rutas Seguras Kids</p>
    </footer>
    <script src="./js/route-card.js" type="module"></script>
    <script src="./js/app.js" type="module"></script>
</body>
</html>
